<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Creation Tool 5.2</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css?v=43" />
  </head>

  <body style="margin:0;padding:0;background-color:#1b2838;">
    <div id="sct-window-frame" class="sct-window-frame">
      <!-- Top Titlebar -->
      <div id="sct-titlebar" class="sct-titlebar">
        <div class="sct-titlebar-left">
          <img
            src="img/icons/icons8-server-24.png"
            srcset="img/icons/icons8-server-24.png 1x, img/icons/icons8-server-48.png 2x"
            class="sct-titlebar-icon"
            alt="SCT"
          />
          <span class="sct-titlebar-title">Server Creation Tool 5.2</span>
        </div>

        <div id="sct-titlebar-task" class="sct-titlebar-task" style="display: none;">
          <div class="sct-titlebar-task-top">
            <span class="sct-titlebar-task-lbl">Task:</span>
            <span id="sct-titlebar-task-msg" class="sct-titlebar-task-msg">Running Task...</span>
          </div>
          <div class="sct-titlebar-task-bottom">
            <div id="sct-titlebar-task-prog" class="sct-titlebar-task-prog marquee">
              <div id="sct-titlebar-task-prog-fill" class="sct-titlebar-task-prog-fill"></div>
            </div>
            <span id="sct-titlebar-task-extra" class="sct-titlebar-task-extra"></span>
          </div>
        </div>

        <div class="sct-titlebar-controls">
          <button
            type="button"
            class="sct-win-btn sct-win-btn-min"
            data-action="minimize-window"
            title="Minimize"
          ></button>
          <button
            type="button"
            class="sct-win-btn sct-win-btn-close"
            data-action="close-window"
            title="Close"
          ></button>
        </div>
      </div>

      <!-- Main Window Inner -->
      <div class="sct-window-inner">
        <div class="sct-border-left"></div>

        <div class="sct-client-area">
          <div class="sct-main-content-wrapper">
            <!-- Top Ribbon Toolbar -->
            <div class="sct-ribbon-bar">
              <div class="sct-ribbon-left">
                <button
                  type="button"
                  class="sct-ribbon-btn"
                  data-action="select-library-location"
                  title="Choose server installation folder"
                >
                  <img src="img/icons/468.png" class="sct-ribbon-icon" alt="" />
                  <span>Select Server Library<br />Location</span>
                </button>

                <button
                  type="button"
                  class="sct-ribbon-btn"
                  data-action="open-settings"
                  title="Application Settings"
                >
                  <img src="img/icons/settingsBtn.Image.png" class="sct-ribbon-icon" alt="" />
                  <span>Settings</span>
                </button>

                <button
                  type="button"
                  id="sct-lang-btn"
                  class="sct-ribbon-btn"
                  data-action="toggle-lang-menu"
                  title="Change Language"
                >
                  <img src="img/icons/translate21.png" class="sct-ribbon-icon" alt="" />
                  <span>Language</span>
                </button>

                <button
                  type="button"
                  class="sct-ribbon-btn"
                  data-action="open-group-website"
                  title="Steam Community Group"
                >
                  <img src="img/icons/world-wide-web21.png" class="sct-ribbon-icon" alt="" />
                  <span>Tool<br />Group-Website</span>
                </button>

                <button
                  type="button"
                  class="sct-ribbon-btn"
                  data-action="open-about"
                  title="About"
                >
                  <img src="img/icons/219121.png" class="sct-ribbon-icon" alt="" />
                  <span>About</span>
                </button>
              </div>

              <div class="sct-ribbon-right">
                <span class="sct-more-label">MORE:</span>
                <button
                  type="button"
                  id="sct-more-btn"
                  class="sct-more-btn"
                  data-action="toggle-more-panel"
                  title="Toggle More section"
                ></button>
              </div>
            </div>

            <!-- Lower Canvas -->
            <div class="sct-workspace">
              <!-- Left Column -->
              <div class="sct-left-column">
                <div class="sct-search-box-row">
                  <label class="sct-search-label" for="sct-search-input">Search:</label>
                  <input type="text" id="sct-search-input" class="sct-search-textbox" />
                  <button
                    type="button"
                    id="sct-fav-toggle-btn"
                    class="sct-fav-toggle-btn"
                    data-action="toggle-favorites-filter"
                    title="Show favourites only"
                  >
                    <img
                      id="sct-fav-toggle-img"
                      src="img/icons/starUnChecked_gray_16.png"
                      alt="Favorites"
                    />
                  </button>
                </div>

                <div class="sct-server-panel-container">
                  <button
                    type="button"
                    id="sct-welcome-btn"
                    class="sct-list-item-welcome"
                    data-action="select-welcome"
                  >
                    ---Welcome---
                  </button>

                  <button
                    type="button"
                    id="sct-reload-btn"
                    class="sct-list-item-reload"
                    data-action="reload-servers"
                  >
                    <span>Reload Servers</span>
                    <img src="img/icons/refresh16x161.png" class="sct-reload-icon" alt="Reload" />
                  </button>

                  <div id="sct-server-items-scroll" class="sct-server-items-scroll"></div>
                </div>
              </div>

              <!-- Right Column -->
              <div id="sct-right-column" class="sct-right-column"></div>
            </div>
          </div>

          <!-- MORE Sidebar Panel -->
          <div class="sct-more-sidebar-panel">
            <button type="button" class="sct-side-btn" data-action="open-app-logs">
              <img src="img/icons/62221.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">App<br />Logs</span>
            </button>

            <button
              type="button"
              id="sct-steamcmd-btn"
              class="sct-side-btn"
              data-action="toggle-steamcmd-menu"
            >
              <img src="img/icons/cmd_icon21.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">SteamCMD<br />options ▼</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="open-planned-features">
              <img src="img/icons/pencil21.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">Planned<br />Features</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="open-faq">
              <img src="img/icons/faqBtn.Image.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">FAQ</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="open-port-forward-guide">
              <img src="img/icons/port.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">How to port<br />forward</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="open-discord">
              <img src="img/icons/discordSrvBtn.Image.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">Discord<br />Server</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="open-github">
              <img src="img/icons/github_logo.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">Github</span>
            </button>

            <button type="button" class="sct-side-btn" data-action="check-for-updates">
              <img src="img/icons/chck4UpdtBtn.Image.png" class="sct-side-btn-icon" alt="" />
              <span class="sct-side-btn-text">Check<br />for updates</span>
            </button>
          </div>
        </div>

        <div class="sct-border-right"></div>
      </div>

      <div class="sct-border-bottom"></div>

      <div id="sct-context-menus-root"></div>
    </div>

    <div id="sct-modal-root"></div>

    <script src="js/window-bridge.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
